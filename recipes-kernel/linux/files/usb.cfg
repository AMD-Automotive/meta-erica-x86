# ===== USB Storage as Built-in (not module) =====
CONFIG_USB=y
CONFIG_USB_STORAGE=y
CONFIG_USB_UAS=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y

# ===== Faster USB Detection =====
# Reduce USB enumeration delay
CONFIG_USB_STORAGE_ONETOUCH=n
CONFIG_USB_STORAGE_USBAT=n
CONFIG_USB_STORAGE_FREECOM=n
CONFIG_USB_STORAGE_ISD200=n
CONFIG_USB_STORAGE_DPCM=n
CONFIG_USB_STORAGE_SDDR09=n
CONFIG_USB_STORAGE_SDDR55=n
CONFIG_USB_STORAGE_JUMPSHOT=n
CONFIG_USB_STORAGE_ALAUDA=n
CONFIG_USB_STORAGE_KARMA=n
CONFIG_USB_STORAGE_CYPRESS_ATACB=n

# ===== Disable Unnecessary SCSI Types =====
CONFIG_CHR_DEV_ST=n
CONFIG_CHR_DEV_OSST=n
CONFIG_BLK_DEV_SR=n
CONFIG_CHR_DEV_SG=n

# ===== Disable Async SCSI Scanning =====
# Force synchronous scanning for faster boot
CONFIG_SCSI_SCAN_ASYNC=n

# ===== Enable Early Root Device Detection =====
CONFIG_PARTITION_ADVANCED=y
CONFIG_MSDOS_PARTITION=y
CONFIG_EFI_PARTITION=y