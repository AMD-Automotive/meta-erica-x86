# ===== SPI bring-up for Ryzen SPI2 → Versal HDIO bank 402 =====
# Schematic: AGPIO130/EGPIO70 (SPI2_CLK), EGPIO75 (SPI2_CS1_L),
#            EGPIO104..107 (SPI2_DAT0..3) -> 402_HDIO5/6/7/8/9/11_SPI_*.
# Goal: expose the AMD SPI controller(s) to userspace via spidev so we can
# generate clock/data activity for electrical probing through the Versal
# PMOD mux (axi_gpio_0 bit 23).
CONFIG_SPI=y
CONFIG_SPI_MASTER=y
CONFIG_SPI_MEM=y
# AMD FCH / ACPI-attached SPI controller (handles AMDI006x / AMDI0F00 / AMDIF030)
CONFIG_SPI_AMD=m
# AMD PCI-attached SPI controller (newer Strix / Phoenix variants)
CONFIG_SPI_AMD_PCI=m
# Userspace access
CONFIG_SPI_SPIDEV=m
