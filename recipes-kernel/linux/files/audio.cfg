# AMD ASoC / ACP audio support
CONFIG_SND_SOC=m
CONFIG_SND_SOC_GENERIC_DMAENGINE_PCM=y
CONFIG_SND_SOC_ACPI=m

# AMD ACP common framework
CONFIG_SND_AMD_ACP_CONFIG=m
CONFIG_SND_SOC_AMD_ACP_COMMON=m
CONFIG_SND_SOC_AMD_ACP_PDM=m
CONFIG_SND_SOC_AMD_ACP_LEGACY_COMMON=m
CONFIG_SND_SOC_AMD_ACP_I2S=m
CONFIG_SND_SOC_AMD_ACP_PCM=m
CONFIG_SND_SOC_AMD_ACP_PCI=m
CONFIG_SND_SOC_AMD_ACPI_MACH=m
CONFIG_SND_SOC_ACPI_AMD_MATCH=m

# ACP6.3 (Phoenix/Hawk Point) platform driver
CONFIG_SND_SOC_AMD_ACP63_TOPLEVEL=m
CONFIG_SND_SOC_AMD_PS=m
CONFIG_SND_SOC_AMD_PS_MACH=m
CONFIG_SND_AMD_ASOC_ACP63=m

# DMIC support (common on AMD laptops/embedded)
CONFIG_SND_SOC_DMIC=m

# ACP7.0 (V4526X detected as acp_asoc_acp70.0)
CONFIG_SND_AMD_ASOC_ACP70=m

# NAU88C22YG codec driver (NVTN2023 ACPI)
CONFIG_SND_SOC_NAU8822=m

# Legacy machine driver (non-SOF, needed for board matching)
CONFIG_SND_SOC_AMD_LEGACY_MACH=m

# I2C Designware controller (AMDI0010 — hosts NAU8822 at \_SB_.I2CD)
CONFIG_I2C_DESIGNWARE_CORE=m
CONFIG_I2C_DESIGNWARE_PLATFORM=m

# I2C userspace access (i2c-tools / /dev/i2c-*)
CONFIG_I2C_CHARDEV=m
