# Simple direct-boot grub.cfg for the rave2-weston-basic image.
# No Xen, no RAUC slots, no installer: boots the kernel straight off the
# USB/wic ext4 rootfs (sda2) for a plain Weston development platform.
# This is grub-weston-basic.cfg

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input serial console

# Graphical themed menu
insmod all_video
insmod gfxterm
insmod font
insmod png
insmod gfxmenu

set gfxmode=1920x1080,1024x768,auto
set gfxpayload=keep

# Load fonts for the theme BEFORE switching to gfxterm.
# gfxterm needs a font at init; without one it silently stays in text mode.
loadfont /EFI/BOOT/theme/DejaVuSans12.pf2
loadfont /EFI/BOOT/theme/DejaVuSans14.pf2
loadfont /EFI/BOOT/theme/DejaVuSans16.pf2
loadfont /EFI/BOOT/theme/DejaVuSans18.pf2
loadfont /EFI/BOOT/theme/DejaVuSansBold18.pf2
loadfont /EFI/BOOT/theme/DejaVuSansBold20.pf2

terminal_output gfxterm serial

# Apply theme
set theme=/EFI/BOOT/theme/theme.txt

set timeout=5
set default='RAVE2 Weston Basic'

menuentry 'RAVE2 Weston Basic' {
    insmod gzio

    linux /bzImage root=/dev/sda2 rw quiet systemd.show_status=false \
        loglevel=0 vt.global_cursor_default=0 \
        console=ttyS0,115200n8 console=tty0 \
        pcie_ports=native pciehp.pciehp_force=1 \
        amd_iommu=off

    initrd /initrd
}
