[Service]
# Weston's DRM backend only enumerates heads on its primary device (card0,
# amdgpu). The safe-display "Virtual-1" output lives on the rave-kms card
# (card1), so expose it as a secondary output-only device. Without this,
# Weston never advertises Virtual-1 and the dashboard falls back to DP-1.
#
# systemd cannot merge two ExecStart= resets: when a second drop-in also resets
# it the lexically later filename silently wins and the other's arguments are
# lost. This package is therefore mutually exclusive with any other
# weston.service ExecStart= override, such as rave-menu in meta-buddy.
ExecStart=
ExecStart=/usr/bin/weston --modules=systemd-notify.so --drm-device=card0 --additional-devices=card1 --config=/etc/xdg/weston/safed.ini
