require conf/distro/poky.conf

DISTRO = "poky-amd-erica"
DISTRO_NAME = "Poky for AMD"
DISTROOVERRIDES = "${DISTRO}"
TARGET_VENDOR = "-amd"
SDK_VENDOR = "-amdsdk"
MAINTAINER = "Kris Chaplin <kris.chaplin@amd.com>"

INIT_MANAGER = "systemd"

EXTRA_IMAGE_FEATURES:append = " package-management ssh-server-openssh"
PACKAGE_CLASSES = "package_deb"

DISTRO_EXTRA_RDEPENDS += "connman udev-extraconf"
DISTRO_FEATURES:append = " systemd "
DISTRO_FEATURES:append = " wayland opengl x11 pam"
DISTRO_FEATURES:append = " wifi"
DISTRO_FEATURES:append = " virtualization xen"
DISTRO_FEATURES:append = " rauc"
VIRTUAL-RUNTIME_init_manager = "systemd"
# ConnMan is the intended network manager for the UI; do not also ship
# systemd-networkd, or both stacks compete for the wired interfaces and each
# NIC ends up with two DHCP leases.  The append below only *adds* resolved and
# timesyncd; networkd is part of systemd's default PACKAGECONFIG, so it must be
# removed explicitly (:remove runs last) or both stacks keep running.
PACKAGECONFIG:append:pn-systemd = " resolved timesyncd"
PACKAGECONFIG:remove:pn-systemd = "networkd"

IMAGE_ROOTFS_EXTRA_SPACE = "51200"

# We want information about package and image contents
INHERIT += "buildhistory"
BUILDHISTORY_COMMIT ?= "1"

# We only support IMAGE_FSTYPES "wic" and "iso"
IMAGE_FSTYPES = "wic wic.bmap iso"

WKS_FILES ?= "erica-x86-usbimage.wks"


# Contents of IMAGE_BOOT_FILES are deployed into "amd-usbimage.wks" wic image
#
# NOTE: the ADAU1860 SSDT is NOT prepended into the initrd as an early-ACPI
# override.  The codec is gated by the menu toggle: rave-menu sets grubenv
# `ssdt_enabled=adau1860`, GRUB injects `ssdt=adau1860` on the kernel cmdline,
# and the initramfs ssdt-loader module loads the template via ACPI ConfigFS
# before switch_root.  Baking it into the initrd forced the codec on every
# boot and defeated the toggle, so the plain initramfs is deployed as-is.
#
IMAGE_BOOT_FILES = " \
    grub-efi-bootx64.efi;EFI/BOOT/bootx64.efi \
    ${EFIIMGDIR}/startup.nsh;startup.nsh \
    ${KERNEL_IMAGETYPE} \
"

# This makes sure that boot files are deployed before do_image_wic starts execution
do_image_wic[depends] += "${IMAGE_BASENAME}:do_bootimg"

IMAGE_OVERHEAD_FACTOR = "1.1"

# Exclude complementary (-src,-dbg & -dev) pkgs of the following
# recipes as they are not required while populate_sdk, and they fail
# to get installed due to missing dependencies, therefore generate a
# warning and even the rest of the complementary pkgs in the list
# don't get installed when using debian based package-managemant.
PACKAGE_EXCLUDE_COMPLEMENTARY = "dpkg|autoconf|automake|packagegroup-core-buildessential|packagegroup-core-sdk|packagegroup-core-tools-profile|perf|quilt|systemtap|target-sdk-provides-dummy"

# "apt" is an exception to the above PACKAGE_EXCLUDE_COMPLEMENTARY list
# as oe uses apt itself to install/remove/exclude the above-listed
# complementary pkgs, and when apt is listed in the above-listed
# PACKAGE_EXCLUDE_COMPLEMENTARY, it tries to removes itself, and it
# asks for user input and oe gets out of there and our complementary
# pkgs don't get installed, but they are required for development and
# debugging purposes using the SDK.
TOOLCHAIN_TARGET_TASK:remove = " apt"

IMAGE_CLASSES += "extrausers"
EXTRA_USERS_PARAMS ?= "\
    useradd -p '' amd-edf; \
    groupadd -r aie; \
    usermod -a -G aie,audio,input,video amd-edf; \
"
USERADDEXTENSION:append = " amd-useradd-sudoers"
EXTRA_USERS_SUDOERS ?= "amd-edf ALL=(ALL) ALL;"

PREFERRED_PROVIDER_virtual/kernel = "linux-virtio-dev"
# PREFERRED_VERSION_linux-amd = "6.12.57"
PREFERRED_PROVIDER_qemu = "qemu-xilinx"
PREFERRED_VERSION_linux-firmware = "20260309"
KERNEL_DANGLING_FEATURES_WARN_ONLY = "1"