# Add this layer's conf and classes to BBPATH
BBPATH .= ":${LAYERDIR}"

# Support both one-level and two-level recipe directory layouts
BBFILES += "${LAYERDIR}/recipes-*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-erica-x86"
BBFILE_PATTERN_meta-erica-x86 = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-erica-x86 = "7"

LAYERDEPENDS_meta-erica-x86 = "core meta-virtio-msg"
LAYERSERIES_COMPAT_meta-erica-x86 = "scarthgap"

# Whether this build wants the safe-display kernel stack (patches and config
# fragments applied to linux-virtio-dev). Set here rather than in the bbappend
# so that recipes other than the kernel can see it -- rave2-safed-x86 checks it
# too, and a recipe-scope default is invisible to them.
# meta-buddy sets it to 0: the kernel is shared by every image in a build, and
# dw-edma binds to the Versal on the hotplug re-enumeration that follows JTAG
# programming and hangs the board.
SAFED_KERNEL ??= "1"

INHERIT += "image-buildinfo"
IMAGE_BUILDINFO_VARS:append = " DATETIME DISTRO_NAME IMAGE_BASENAME MACHINE TUNE_PKGARCH"
IMAGE_BUILDINFO_VARS:append = " MACHINE_FEATURES DISTRO_FEATURES COMMON_FEATURES IMAGE_FEATURES"
