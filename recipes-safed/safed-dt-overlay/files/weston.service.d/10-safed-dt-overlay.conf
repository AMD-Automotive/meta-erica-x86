[Unit]
# Ensure the PL device tree overlay is applied (and the rave-kms DRM device
# thus present) before the compositor starts. Wants= pulls the overlay into
# the boot transaction; After= orders us after it has finished applying.
Wants=safed-dt-overlay.service
After=safed-dt-overlay.service
