# Safe Display (x86): enable Open Firmware / device-tree overlay support so the
# runtime DT injection and overlay flow used by the safe-display PCIe/PL stack
# works on x86 (which normally boots without a firmware-provided device tree).
CONFIG_OF=y
CONFIG_OF_OVERLAY=y
CONFIG_OF_DYNAMIC=y
