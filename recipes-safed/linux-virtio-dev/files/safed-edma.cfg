# Safe Display (x86): build the DesignWare eDMA driver with PCIe glue so the
# AMD MDB PCIe endpoint (dw-edma) support and the OF proxy DMA interface added
# by the safe-display kernel patches are available. of-dw-edma.o is guarded by
# CONFIG_OF_DYNAMIC (enabled by the stage 1.1 safed-of.cfg fragment).
# DMADEVICES gates the whole drivers/dma menu; without it the DW_EDMA symbols
# are hidden and the values below are silently dropped.
CONFIG_DMADEVICES=y
CONFIG_DW_EDMA=y
CONFIG_DW_EDMA_PCIE=y
